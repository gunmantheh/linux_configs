# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# shell
#set -g default-command /usr/bin/fish
#set -g default-shell /usr/bin/fish

set -g default-command /bin/zsh
set -g default-shell /bin/zsh


set-window-option -g mode-keys vi
#bind-key -t vi-copy 'v' begin-selection
#bind-key -t vi-copy 'y' copy-selection
set-option -g prefix C-a

# Activity monitoring
# setw -g monitor-activity on
# set -g visual-activity on

# start with window 1 (instead of 0)
set -g base-index 1


# start with pane 1
set -g pane-base-index 1

#set history-limit 100002

# screen mode
#set -g default-terminal "xterm"
set -g default-terminal "screen-256color"

# history
set -g history-limit 100000


# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'


# panes

# resize panes with mouse (drag borders)
unbind J
unbind K
unbind H
unbind L

bind-key J resize-pane -D 3
bind-key K resize-pane -U 3
bind-key H resize-pane -L 3
bind-key L resize-pane -R 3

set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'



# This is color section
# Status bar
set -g status-interval 5 # refresh every 5 seconds
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 110
set -g status-style fg=colour252,bg=colour235

# Left: prefix indicator, session, host, current path
set -g status-left '#[fg=colour10,bold]#{?client_prefix,[*],[ ]} #[fg=colour148,bold]#S #[fg=colour240]| #[fg=colour190]#H #[fg=colour240]| #[fg=colour252]#{pane_current_path} '

# Right: load, temperature (with fallback), battery (state + charge, with fallback), date/time
set -g status-right '#(~/.tmux/status-right.sh)'

# Window tabs styling
setw -g window-status-style fg=colour244,bg=colour235
setw -g window-status-format ' #I:#W #{?window_zoomed_flag,Z,}#F '
setw -g window-status-current-style fg=colour235,bg=colour148,bold
setw -g window-status-current-format '#[fg=colour235,bg=colour148,bold] #I:#W #{?window_zoomed_flag,Z,}#F '

# alerted window (display beep)
#setw -g window-status-alert-fg colour196
#setw -g window-status-alert-bg default

# command/message line colors

# pane colors


#setw -g automatic-rename off

bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

#source '/usr/share/tmux/powerline.conf'

# pane divider
#set-window-option -g pane-border-style fg=colour11,bg=colour234
#set-window-option -g pane-active-border-style fg=colour118,bg=colour234

# Dim non-active panel
#set-window-option -g window-style fg=white,bg=colour235
#set-window-option -g window-active-style fg=white,bg=colour0

#set-window-option -g message-style fg=black,bold,bg=colour11

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
